<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><title>植物大战僵尸</title><style>body{text-align:center;background:#87ceeb;font-family:Arial}.card{display:inline-block;background:#fff;border:2px solid #555;padding:8px;margin:5px;cursor:pointer;border-radius:10px}canvas{background:#5cb85c;border:3px solid #333;border-radius:8px}</style></head><body><h1>🌻植物大战僵尸</h1><div id='cards'></div><h3>☀️阳光:<span id='sun'>150</span> 得分:<span id='score'>0</span></h3><canvas id='game' width='800' height='400'></canvas><script>let ctx=game.getContext('2d'),sun=150,score=0,plants=[],zombies=[],bullets=[],sunballs=[],selected=null,rowH=80;let types=[['🌻向日葵',50,'sun',10,5],['🌱豌豆射手',100,'pea',10,8],['🥜坚果墙',75,'wall',40,10]];types.forEach((t,i)=>{t.cool=0;let d=document.createElement('div');d.className='card';d.id='card'+i;d.innerHTML=t[0]+'<br>'+t[1]+'☀️<br><span>可用</span>';d.onclick=()=>{if(t.cool<=0)selected=t};cards.appendChild(d)});function update(){document.getElementById('sun').innerHTML=sun;document.getElementById('score').innerHTML=score;types.forEach((t,i)=>{if(t.cool>0){t.cool--;document.querySelector('#card'+i+' span').innerHTML='冷却 '+t.cool+'s'}else document.querySelector('#card'+i+' span').innerHTML='可用'})}game.onclick=e=>{let x=e.offsetX,y=e.offsetY,r=Math.floor(y/80);if(selected&&sun>=selected[1]){let col=Math.floor(x/80);if(!plants.some(p=>p.row==r&&p.col==col)){sun-=selected[1];selected.cool=selected[4];plants.push({x:col*80+40,y:r*80+55,row:r,col,type:selected[2],hp:selected[3],max:selected[3]});update()}}};setInterval(()=>zombies.push({x:780,row:Math.floor(Math.random()*5),hp:5,attack:0}),2500);function loop(){ctx.clearRect(0,0,800,400);ctx.font='42px Arial';for(let i=0;i<5;i++)ctx.strokeRect(0,i*80,800,80);plants.forEach(p=>{ctx.fillText(p.type==='pea'?'🌿🟢':p.type==='sun'?'🌻':'🥜',p.x-25,p.y);ctx.fillStyle='lime';ctx.fillRect(p.x-25,p.y+10,50*p.hp/p.max,5);if(p.type==='pea'&&Math.random()<.05)bullets.push({x:p.x,y:p.y,row:p.row})});zombies.forEach(z=>{let target=plants.find(p=>p.row==z.row&&Math.abs(p.x-z.x)<35);if(target){z.attack++;if(z.attack>60){target.hp--;z.attack=0;if(target.hp<=0)plants.splice(plants.indexOf(target),1)}}else z.x-=.36;ctx.fillText('🧟‍♂️',z.x,z.row*80+55);ctx.font='16px Arial';ctx.fillText('❤'+z.hp,z.x,z.row*80+75);ctx.font='42px Arial'});bullets.forEach((b,i)=>{b.x+=1.25;ctx.fillText('🟢',b.x,b.y);zombies.forEach((z,j)=>{if(z.row==b.row&&Math.abs(b.x-z.x)<25){z.hp--;bullets.splice(i,1);if(z.hp<=0){zombies.splice(j,1);score++;update()}}})});requestAnimationFrame(loop)}setInterval(()=>{sunballs.push({x:Math.random()*750,y:40+Math.random()*320});update()},3000);setInterval(()=>{sun+=25;update()},5000);update();loop();</script></body></html>

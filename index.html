<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><title>植物大战僵尸</title><style>body{text-align:center;background:#87ceeb;font-family:Arial}.card{display:inline-block;background:#fff;border:2px solid #555;padding:8px;margin:5px;cursor:pointer;border-radius:10px}canvas{background:#5cb85c;border:3px solid #333;border-radius:8px}</style></head><body><h1>🌻植物大战僵尸</h1><div id='cards'></div><h3>☀️阳光:<span id='sun'>150</span> 得分:<span id='score'>0</span></h3><canvas id='game' width='800' height='400'></canvas><script>let ctx=game.getContext('2d'),sun=150,score=0,plants=[],zombies=[],bullets=[],selected=null,frame=0;let types=[['🌻向日葵',50,'sun',10,5],['🌱豌豆射手',100,'pea',10,8],['🥜坚果墙',75,'wall',40,10]];types.forEach((t,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=t[0]+'<br>'+t[1]+'☀️';d.onclick=()=>selected=t;cards.appendChild(d)});game.onclick=e=>{let r=Math.floor(e.offsetY/80),c=Math.floor(e.offsetX/80);if(selected&&sun>=selected[1]){sun-=selected[1];plants.push({x:c*80+40,y:r*80+55,row:r,col:c,type:selected[2],hp:selected[3],max:selected[3],open:false});update()}};function update(){sunEl.innerHTML=sun;scoreEl.innerHTML=score}setInterval(()=>zombies.push({x:780,row:Math.floor(Math.random()*5),hp:5,attack:0,walk:0}),2500);function loop(){frame++;ctx.clearRect(0,0,800,400);for(let i=0;i<5;i++)ctx.strokeRect(0,i*80,800,80);plants.forEach(p=>{ctx.font='42px Arial';if(p.type==='pea'){p.open=frame%40<15;ctx.fillText(p.open?'🌱😮':'🌱',p.x-25,p.y);if(frame%50===0)bullets.push({x:p.x+20,y:p.y-10,row:p.row})}else ctx.fillText(p.type==='sun'?'🌻':'🥜',p.x-20,p.y);ctx.fillStyle='lime';ctx.fillRect(p.x-25,p.y+10,50*p.hp/p.max,5)});zombies.forEach(z=>{let t=plants.find(p=>p.row==z.row&&Math.abs(p.x-z.x)<35);if(t){z.attack++;if(z.attack>60){t.hp--;z.attack=0}}else z.x-=.36;z.walk+=0.15;let swing=Math.sin(z.walk)*6;ctx.save();ctx.translate(z.x,z.row*80+55+swing);ctx.rotate(Math.sin(z.walk)*0.05);ctx.font='42px Arial';ctx.fillText('🧟‍♂️',0,0);ctx.restore();ctx.font='16px Arial';ctx.fillText('❤'+z.hp,z.x,z.row*80+75)});bullets.forEach((b,i)=>{b.x+=1.25;ctx.font='20px Arial';ctx.fillText('🟢',b.x,b.y);zombies.forEach((z,j)=>{if(z.row==b.row&&Math.abs(b.x-z.x)<25){z.hp--;bullets.splice(i,1);if(z.hp<=0){zombies.splice(j,1);score++;update()}}})});requestAnimationFrame(loop)}setInterval(()=>{sun+=25;update()},5000);update();loop();</script></body></html>

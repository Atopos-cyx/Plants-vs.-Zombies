<!DOCTYPE html><html><head><meta charset='UTF-8'><title>植物大战僵尸</title><style>body{text-align:center;background:#87ceeb;font-family:Arial}canvas{background:#5cb85c;border:3px solid #333}.card{display:inline-block;padding:8px;background:white;margin:5px}</style></head><body><h1>🌻植物大战僵尸</h1><div id='cards'></div><h3>☀️<span id='sun'>150</span> 分数:<span id='score'>0</span></h3><canvas id='game' width='800' height='400'></canvas><script>let c=game,ctx=c.getContext('2d'),sun=150,score=0,frame=0,plants=[],zombies=[],bullets=[],suns=[];let types=[['🌻',50,'sun'],['🌱',100,'pea'],['🥜',75,'wall']],sel=null;types.forEach(t=>{let d=document.createElement('div');d.className='card';d.innerHTML=t[0]+' '+t[1];d.onclick=()=>sel=t;cards.appendChild(d)});c.onclick=e=>{if(sel&&sun>=sel[1]){sun-=sel[1];plants.push({x:e.offsetX,y:e.offsetY,row:Math.floor(e.offsetY/80),type:sel[2],hp:sel[2]=='wall'?40:10});up()}};setInterval(()=>suns.push({x:50+Math.random()*700,y:20,t:100}),4000);setInterval(()=>zombies.push({x:780,row:Math.floor(Math.random()*5),hp:5}),2500);function up(){document.getElementById('sun').innerHTML=sun;scoreEl.innerHTML=score}function loop(){frame++;ctx.clearRect(0,0,800,400);plants.forEach(p=>{let bob=p.type=='sun'?Math.sin(frame/10)*5:0;ctx.font='42px Arial';ctx.fillText(p.type=='pea'?'🌱😮':' '+(p.type=='sun'?'🌻':'🥜'),p.x-20,p.y+bob);if(p.type=='pea'&&frame%50==0)bullets.push({x:p.x+20,y:p.y-20,row:p.row});ctx.fillStyle='lime';ctx.fillRect(p.x-20,p.y+10,40*p.hp/(p.type=='wall'?40:10),5)});suns.forEach((s,i)=>{ctx.font='30px Arial';ctx.fillText('☀️',s.x,s.y);s.y+=.2;if(s.y>380)suns.splice(i,1)});zombies.forEach(z=>{ctx.font='40px Arial';ctx.fillText('🧟',z.x,z.row*80+55);z.x-=.36});bullets.forEach((b,i)=>{b.x+=1.25;ctx.fillText('🟢',b.x,b.y);zombies.forEach((z,j)=>{if(z.row==b.row&&Math.abs(b.x-z.x)<20){z.hp--;if(z.hp<=0){zombies.splice(j,1);score++}bullets.splice(i,1)}})});requestAnimationFrame(loop)}c.addEventListener('click',e=>suns.forEach((s,i)=>{if(Math.hypot(e.offsetX-s.x,e.offsetY-s.y)<45){sun+=25;suns.splice(i,1);up()}}));setInterval(()=>{sun+=25;up()},5000);up();loop();</script></body></html>
